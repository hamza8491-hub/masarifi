<!doctype html><html lang="ar" dir="rtl"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>مصاريفي</title>
<style>
body{font-family:-apple-system,Arial;background:#f4f7fb;margin:0;color:#17202a}header{background:#0877e8;color:#fff;padding:25px;text-align:center;font-size:28px;font-weight:bold;border-radius:0 0 25px 25px}main{padding:14px;max-width:650px;margin:auto}.card{background:#fff;padding:16px;border-radius:18px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#f5f7fa;padding:13px;border-radius:12px}.num{font-size:21px;font-weight:bold;margin-top:5px}.green{color:#0aaf72}input,select,button{width:100%;padding:13px;margin:5px 0;border-radius:11px;border:1px solid #d5dce5;font-size:16px;box-sizing:border-box}button{background:#0877e8;color:white;border:0;font-weight:bold}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{background:#eef5ff;color:#1769aa}.item{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.small{color:#687386;font-size:13px}
</style>
<header>💰 مصاريفي<div style="font-size:13px">تنظيم مصاريفك بسهولة</div></header><main>
<div class="card"><div class="small">الرصيد المتبقي</div><div class="num green" id="bal">0 دج</div><div class="grid"><div class="box">دخل الشهر<div class="num" id="inc">0 دج</div></div><div class="box">مصاريف الشهر<div class="num" id="exp">0 دج</div></div></div></div>
<div class="card"><b>أقسام المصاريف</b><div class="cats">
<button class="cat" onclick="setCat('مدرسة')">🏫<br>المدرسة</button><button class="cat" onclick="setCat('منزل')">🏠<br>المنزل</button><button class="cat" onclick="setCat('سيارة ووقود')">🚗<br>السيارة</button><button class="cat" onclick="setCat('مشتريات')">🛒<br>المشتريات</button><button class="cat" onclick="setCat('عائلة')">👨‍👩‍👧<br>العائلة</button><button class="cat" onclick="setCat('أخرى')">•••<br>أخرى</button></div></div>
<div class="card"><b>➕ إضافة عملية</b><input id="amount" type="number" placeholder="المبلغ بالدج" inputmode="decimal"><select id="kind"><option value="expense">مصروف</option><option value="income">دخل</option></select><select id="cat"><option>مدرسة</option><option>منزل</option><option>سيارة ووقود</option><option>مشتريات</option><option>عائلة</option><option>أكل</option><option>أقساط وديون</option><option>صحة</option><option>هاتف وإنترنت</option><option>ادخار</option><option>أخرى</option></select><input id="note" placeholder="ملاحظة"><button onclick="add()">حفظ</button></div>
<div class="card"><b>🏫 أطفال المدرسة</b><input id="child" placeholder="اسم الطفل"><input id="school" placeholder="اسم المدرسة"><button onclick="addChild()">إضافة طفل</button><div id="kids"></div></div>
<div class="card"><b>📋 آخر العمليات</b><div id="list"></div></div>
</main>
<script>
let d=JSON.parse(localStorage.getItem('mdata')||'{"t":[],"c":[]}');const money=x=>Number(x).toLocaleString('ar-DZ')+' دج';function save(){localStorage.setItem('mdata',JSON.stringify(d));render()}function setCat(x){document.getElementById('cat').value=x;document.getElementById('amount').focus()}function add(){let a=+amount.value;if(!a)return alert('أدخل المبلغ');d.t.unshift({a,k:kind.value,c:cat.value,n:note.value,date:new Date().toLocaleDateString('ar-DZ')});amount.value='';note.value='';save()}function addChild(){if(!child.value)return alert('أدخل اسم الطفل');d.c.push({n:child.value,s:school.value});child.value='';school.value='';save()}function render(){let inc=d.t.filter(x=>x.k==='income').reduce((s,x)=>s+x.a,0),exp=d.t.filter(x=>x.k==='expense').reduce((s,x)=>s+x.a,0);bal.textContent=money(inc-exp);document.getElementById('inc').textContent=money(inc);document.getElementById('exp').textContent=money(exp);list.innerHTML=d.t.slice(0,10).map(x=>`<div class=item><span><b>${money(x.a)}</b><br><span class=small>${x.k==='income'?'دخل':'مصروف'} • ${x.c} • ${x.date}</span></span></div>`).join('')||'<span class=small>لا توجد عمليات</span>';kids.innerHTML=d.c.map(x=>`<div class=item><span><b>${x.n}</b><br><span class=small>${x.s||'بدون مدرسة'}</span></span></div>`).join('')||'<span class=small>أضف الأطفال هنا</span>'}render();
</script></html>
